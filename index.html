<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अजय कुमार वेजिटेबल्स - पार्टनर ऐप (दुकानदार)</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 0; color: #333; }
        .header { background-color: #1b5e20; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        .container { max-width: 500px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .section-title { font-size: 16px; font-weight: bold; color: #1b5e20; margin-top: 20px; margin-bottom: 10px; border-bottom: 2px solid #c8e6c9; padding-bottom: 5px; }
        label { display: block; margin-top: 10px; font-size: 14px; font-weight: bold; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { background-color: #2e7d32; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        .btn:hover { background-color: #1b5e20; }
        .help-btn { background-color: #0288d1; margin-top: 10px; text-decoration: none; display: block; text-align: center; color: white; padding: 12px; border-radius: 4px; font-size: 16px; font-weight: bold; }
        .help-btn:hover { background-color: #01579b; }
        .sound-btn { background-color: #ff9800; margin-top: 10px; }
        .sound-btn:hover { background-color: #f57c00; }
        
        .action-btns { display: flex; gap: 10px; margin-top: 10px; }
        .accept-btn { background-color: #2e7d32; flex: 1; padding: 10px; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .accept-btn:hover { background-color: #1b5e20; }
        .reject-btn { background-color: #d32f2f; flex: 1; padding: 10px; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .reject-btn:hover { background-color: #b71c1c; }

        .hidden { display: none; }
        .veg-item, .order-item { background: #f9f9f9; padding: 12px; margin-top: 10px; border-radius: 4px; border: 1px solid #ddd; }
        .order-item { background: #fff3e0; border-left: 5px solid #ff9800; animation: blinkBorder 1s infinite alternate; }
        @keyframes blinkBorder {
            from { border-left-color: #ff9800; background: #fff3e0; }
            to { border-left-color: #d32f2f; background: #ffebee; }
        }
        .otp-msg { background: #e8f5e9; border: 1px solid #a5d6a7; padding: 10px; margin-top: 10px; border-radius: 4px; color: #2e7d32; font-weight: bold; text-align: center; }
        .badge-success { background: #4caf50; color: white; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
    </style>
</head>
<body>

    <div class="header">
        अजय कुमार वेजिटेबल्स - पार्टनर ऐप
    </div>

    <div class="container">
        <!-- लॉगिन सेक्शन -->
        <div id="loginSection">
            <div class="section-title">दुकानदार लॉगिन (OTP द्वारा)</div>
            <label>अपना 10 अंकों का मोबाइल नंबर दर्ज करें:</label>
            <input type="text" id="loginMobile" placeholder="मोबाइल नंबर" maxlength="10">
            <button class="btn" onclick="sendOTP()">ओटीपी भेजें</button>
            
            <div id="otpDisplayBox" class="hidden otp-msg"></div>

            <div id="otpBox" class="hidden">
                <label>संदेश में प्राप्त 4 अंकों का OTP दर्ज करें:</label>
                <input type="text" id="otpInput" placeholder="4 अंकों का ओटीपी" maxlength="4">
                <button class="btn" onclick="verifyOTP()">लॉगिन करें</button>
            </div>
        </div>

        <!-- मुख्य डैशबोर्ड -->
        <div id="dashboardSection" class="hidden">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <span style="font-size: 14px; color: #555;">लॉगिन मोबाइल: <b id="userMobileDisplay"></b></span>
                <button onclick="logout()" style="background: #d32f2f; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer;">लॉग आउट</button>
            </div>

            <!-- नए ऑर्डर्स और अलार्म सेक्शन -->
            <div class="section-title">🚨 नए कस्टमर ऑर्डर्स (लाइव)</div>
            <button class="btn sound-btn" onclick="simulateNewOrder()">🔔 टेस्ट नया ऑर्डर मंगाएं (अलार्म चेक करें)</button>
            
            <div id="orderListContainer">
                <!-- यहाँ नए ऑर्डर लगातार अलार्म के साथ आएंगे -->
            </div>

            <!-- दुकान की सेटिंग्स -->
            <div class="section-title">⚙️ दुकान की सेटिंग्स & UPI</div>
            <label>आपकी दुकान की UPI ID:</label>
            <input type="text" id="shopUpi" value="8218231811@nyes">

            <label>आपका WhatsApp नंबर (देश कोड के साथ):</label>
            <input type="text" id="shopWhatsapp" value="919997077062">

            <button class="btn" onclick="saveSettings()">सेटिंग्स सेव करें</button>

            <!-- डिलीवरी नियम और शर्तें -->
            <div class="section-title">📜 डिलीवरी नियम और शर्तें सेट करें</div>
            <label>न्यूनतम ऑर्डर राशि (₹):</label>
            <input type="number" id="minOrderAmt" value="200">

            <label>कम ऑर्डर पर अतिरिक्त फिक्स चार्ज (₹):</label>
            <input type="number" id="extraCharge" value="50">

            <label>₹200 से अधिक ऑर्डर पर प्रति किलो चार्ज (₹):</label>
            <input type="number" id="perKgCharge" value="10">

            <label>अधिकतम डिलीवरी दूरी (किलोमीटर में):</label>
            <input type="number" id="maxDistance" value="5">

            <button class="btn" onclick="saveRules()">शर्तें और नियम सेव करें</button>

            <!-- सब्जी कैटलॉग मैनेजमेंट -->
            <div class="section-title">➕ नई सब्जी कैटलॉग में जोड़ें</div>
            <label>सब्जी का नाम:</label>
            <input type="text" id="vegName" placeholder="जैसे: आलू, टमाटर">

            <label>प्रति किलो मूल्य (₹):</label>
            <input type="number" id="vegPrice" placeholder="मूल्य प्रति किलो">

            <button class="btn" onclick="addVegetable()">सब्जी सूची में जोड़ें</button>

            <div class="section-title">📋 वर्तमान सब्जी सूची (स्टॉक मैनेजमेंट)</div>
            <div id="vegListContainer">
                <div class="veg-item" style="display: flex; justify-content: space-between; align-items: center;">
                    <span><b>आलू</b> - ₹30/किग्रा (उपलब्ध: हाँ)</span>
                    <button onclick="toggleStock(this)" style="background: green; color: white; border: none; padding: 5px; border-radius: 3px; cursor: pointer;">चालू</button>
                </div>
            </div>

            <!-- हेल्प बटन -->
            <a href="tel:9997077062" class="help-btn">📞 Help (तकनीकी सहायता कॉल करें)</a>
        </div>
    </div>

    <script>
        let generatedOTP = "";
        let alarmInterval = null;
        let audioCtx = null;
        let activeOrdersCount = 0;

        window.onload = function() {
            let savedMobile = localStorage.getItem('vendor_mobile');
            if(savedMobile) {
                document.getElementById('userMobileDisplay').innerText = savedMobile;
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
            }
        };

        function sendOTP() {
            var mobile = document.getElementById('loginMobile').value;
            if(mobile.length === 10) {
                generatedOTP = Math.floor(1000 + Math.random() * 9000).toString();
                var otpMsgBox = document.getElementById('otpDisplayBox');
                otpMsgBox.innerText = `📩 नया संदेश (OTP): आपका वन-टाइम पासवर्ड है -> ${generatedOTP}`;
                otpMsgBox.classList.remove('hidden');
                document.getElementById('otpBox').classList.remove('hidden');
                alert('ओटीपी जनरेट हो गया है! नीचे बॉक्स में देखें।');
            } else {
                alert('कृपया सही 10 अंकों का मोबाइल नंबर दर्ज करें।');
            }
        }

        function verifyOTP() {
            var otp = document.getElementById('otpInput').value;
            if(otp === generatedOTP && otp !== "") {
                var mobile = document.getElementById('loginMobile').value;
                localStorage.setItem('vendor_mobile', mobile);
                
                document.getElementById('userMobileDisplay').innerText = mobile;
                alert('लॉगिन सफल रहा!');
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('dashboardSection').classList.remove('hidden');
            } else {
                alert('गलत OTP! कृपया सही ओटीपी दर्ज करें।');
            }
        }

        function logout() {
            localStorage.removeItem('vendor_mobile');
            stopAlarm();
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('loginMobile').value = '';
            document.getElementById('otpInput').value = '';
            document.getElementById('otpBox').classList.add('hidden');
            document.getElementById('otpDisplayBox').classList.add('hidden');
        }

        // लगातार तेज बजने वाला सायरन अलार्म
        function startContinuousAlarm() {
            if (alarmInterval) return;

            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                let playLoudBeep = () => {
                    let now = audioCtx.currentTime;
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(1000, now);
                    osc.frequency.setValueAtTime(1800, now + 0.2);
                    
                    gain.gain.setValueAtTime(0.8, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    
                    osc.start(now);
                    osc.stop(now + 0.4);
                };

                playLoudBeep();
                alarmInterval = setInterval(playLoudBeep, 500);
            } catch (e) {
                console.log(e);
            }
        }

        function stopAlarm() {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
        }

        // नया टेस्ट ऑर्डर जोड़ने का फंक्शन
        function simulateNewOrder() {
            var container = document.getElementById('orderListContainer');
            
            var orderId = Math.floor(100 + Math.random() * 900);
            var newDiv = document.createElement('div');
            newDiv.className = 'order-item';
            newDiv.id = 'order_' + orderId;
            newDiv.innerHTML = `
                <div style="display: flex; justify-content: space-between;">
                    <b>नया आर्डर #${orderId}</b>
                    <span class="badge-success">UPI भुगतान सफल (₹240)</span>
                </div>
                <hr style="border:0; border-top:1px solid #ddd; margin:8px 0;">
                <p style="margin: 4px 0;"><b>ग्राहक:</b> अमित कुमार</p>
                <p style="margin: 4px 0;"><b>सामग्री:</b> टमाटर 3kg, प्याज़ 2kg</p>
                <p style="margin: 4px 0;"><b>पत्ता/पता:</b> मकान नं. 12, गांधी नगर चौराहा</p>
                <p style="margin: 4px 0; color: #d32f2f;"><b>दूरी:</b> दुकान से 1.8 किलोमीटर दूर</p>
                
                <div class="action-btns">
                    <button class="accept-btn" onclick="acceptOrder('${orderId}')">✅ स्वीकार करें</button>
                    <button class="reject-btn" onclick="rejectOrder('${orderId}')">❌ रिजेक्ट करें</button>
                </div>
            `;
            
            container.prepend(newDiv);
            activeOrdersCount++;
            
            startContinuousAlarm();
            alert('🚨 नया आर्डर आ गया है! लगातार तेज घंटी बज रही है।');
        }

        // आर्डर स्वीकार करने पर
        function acceptOrder(orderId) {
            var orderElement = document.getElementById('order_' + orderId);
            if (orderElement) {
                orderElement.style.animation = 'none';
                orderElement.style.background = '#e8f5e9';
                orderElement.style.borderLeft = '5px solid #4caf50';
                orderElement.innerHTML = `
                    <div style="display: flex; justify-content: space-between;">
                        <b>आर्डर #${orderId} (स्वीकृत)</b>
                        <span class="badge-success">पैक कर रहे हैं</span>
                    </div>
                    <p style="margin: 4px 0; color: #2e7d32; font-weight: bold;">✔ आपने यह ऑर्डर स्वीकार कर लिया है। सामान पैक करें।</p>
                `;
            }

            activeOrdersCount--;
            if (activeOrdersCount <= 0) {
                stopAlarm();
                activeOrdersCount = 0;
            }
            alert('ऑर्डर स्वीकार कर लिया गया है!');
        }

        // आर्डर रिजेक्ट करने पर
        function rejectOrder(orderId) {
            var orderElement = document.getElementById('order_' + orderId);
            if (orderElement) {
                orderElement.style.animation = 'none';
                orderElement.style.background = '#ffebee';
                orderElement.style.borderLeft = '5px solid #d32f2f';
                orderElement.innerHTML = `
                    <div style="display: flex; justify-content: space-between;">
                        <b>आर्डर #${orderId} (रिफ्यूज/रद्द)</b>
                        <span style="background:#d32f2f; color:white; padding:3px 8px; border-radius:4px; font-size:12px;">रद्द किया गया</span>
                    </div>
                    <p style="margin: 4px 0; color: #d32f2f; font-weight: bold;">✖ आपने यह ऑर्डर रिजेक्ट कर दिया है।</p>
                `;
            }

            activeOrdersCount--;
            if (activeOrdersCount <= 0) {
                stopAlarm();
                activeOrdersCount = 0;
            }
            alert('ऑर्डर रिजेक्ट कर दिया गया है!');
        }

        function saveSettings() {
            alert('दुकान की सेटिंग्स सफलतापूर्वक सेव हो गई हैं!');
        }

        function saveRules() {
            var minOrd = document.getElementById('minOrderAmt').value;
            var extChg = document.getElementById('extraCharge').value;
            var pkgChg = document.getElementById('perKgCharge').value;
            var maxDist = document.getElementById('maxDistance').value;
            alert(`डिलीवरी नियम अपडेट हो गए!\n- मिनिमम ऑर्डर: ₹${minOrd}\n- कम ऑर्डर चार्ज: ₹${extChg}\n- प्रति किलो चार्ज: ₹${pkgChg}\n- अधिकतम दूरी: ${maxDist} किमी`);
        }

        function addVegetable() {
            var name = document.getElementById('vegName').value;
            var price = document.getElementById('vegPrice').value;
            if(name && price) {
                var container = document.getElementById('vegListContainer');
                var newItem = document.createElement('div');
                newItem.className = 'veg-item';
                newItem.style.display = 'flex';
                newItem.style.justifyContent = 'space-between';
                newItem.style.alignItems = 'center';
                newItem.innerHTML = `<span><b>${name}</b> - ₹${price}/किग्रा (उपलब्ध: हाँ)</span> <button onclick="toggleStock(this)" style="background: green; color: white; border: none; padding: 5px; border-radius: 3px; cursor: pointer;">चालू</button>`;
                container.appendChild(newItem);
                document.getElementById('vegName').value = '';
                document.getElementById('vegPrice').value = '';
                alert('सब्जी सफलतापूर्वक जोड़ दी गई है!');
            } else {
                alert('कृपया सब्जी का नाम और मूल्य दोनों भरें।');
            }
        }

        function toggleStock(btn) {
            if(btn.innerText === 'चालू') {
                btn.innerText = 'बंद';
                btn.style.backgroundColor = 'red';
            } else {
                btn.innerText = 'चालू';
                btn.style.backgroundColor = 'green';
            }
        }
    </script>
</body>
</html>
