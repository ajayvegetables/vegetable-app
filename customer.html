<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अजय कुमार वेजिटेबल्स - ऑनलाइन आर्डर</title>
    <style>
        body { font-family: Arial, sans-serif; background: #e8f5e9; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #2e7d32; text-align: center; margin-bottom: 5px; }
        .sub-title { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
        .product-card { display: flex; justify-content: space-between; align-items: center; background: #f1f8e9; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #c8e6c9; }
        .product-info h4 { margin: 0 0 5px 0; color: #1b5e20; }
        .product-info p { margin: 0; color: #555; font-size: 14px; }
        .qty-box { display: flex; align-items: center; gap: 8px; }
        .qty-box input { width: 50px; padding: 5px; text-align: center; border: 1px solid #ccc; border-radius: 4px; }
        .form-group { margin-top: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn-submit { background: #2e7d32; color: white; border: none; width: 100%; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn-submit:hover { background: #1b5e20; }
    </style>
</head>
<body>

<div class="container">
    <h2>🥬 अजय कुमार वेजिटेबल्स</h2>
    <div class="sub-title">ताज़ा सब्ज़ी सीधे आपके घर! अपना आर्डर चुनें</div>

    <div id="products-list">
        <!-- प्रोडक्ट लिस्ट यहाँ दिखेगी -->
        <div class="product-card">
            <div class="product-info">
                <h4>टमाटर (Tomato)</h4>
                <p>₹40 / kg</p>
            </div>
            <div class="qty-box">
                <input type="number" id="qty_0" min="0" value="0" placeholder="Kg">
            </div>
        </div>

        <div class="product-card">
            <div class="product-info">
                <h4>आलू (Potato)</h4>
                <p>₹30 / kg</p>
            </div>
            <div class="qty-box">
                <input type="number" id="qty_1" min="0" value="0" placeholder="Kg">
            </div>
        </div>

        <div class="product-card">
            <div class="product-info">
                <h4>प्याज़ (Onion)</h4>
                <p>₹50 / kg</p>
            </div>
            <div class="qty-box">
                <input type="number" id="qty_2" min="0" value="0" placeholder="Kg">
            </div>
        </div>

        <div class="product-card">
            <div class="product-info">
                <h4>हरी मिर्च (Green Chilli)</h4>
                <p>₹80 / kg</p>
            </div>
            <div class="qty-box">
                <input type="number" id="qty_3" min="0" value="0" placeholder="Kg">
            </div>
        </div>
    </div>

    <div class="form-group">
        <label>आपका नाम:</label>
        <input type="text" id="customerName" placeholder="अपना नाम लिखें">
    </div>

    <div class="form-group">
        <label>मोबाइल नंबर:</label>
        <input type="tel" id="customerPhone" placeholder="10 अंकों का मोबाइल नंबर">
    </div>

    <div class="form-group">
        <label>पूरी डिलीवरी का पता (Address):</label>
        <textarea id="customerAddress" rows="3" placeholder="घर का नंबर, गली, मोहल्ला..."></textarea>
    </div>

    <button class="btn-submit" onclick="sendOrder()">🚀 आर्डर भेजें</button>
</div>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD4LjdqlsKNH7ZU9p8NMgtnqDuybiSI0fs",
        authDomain: "ajayvegetables-e6201.firebaseapp.com",
        databaseURL: "https://ajayvegetables-e6201-default-rtdb.firebaseio.com",
        projectId: "ajayvegetables-e6201",
        storageBucket: "ajayvegetables-e6201.firebasestorage.app",
        messagingSenderId: "735482766488",
        appId: "1:735482766488:web:a7121405cb15fffefd1ced",
        measurementId: "G-KBGKZ36RY8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.sendOrder = function() {
        const name = document.getElementById('customerName').value.trim();
        const phone = document.getElementById('customerPhone').value.trim();
        const address = document.getElementById('customerAddress').value.trim();

        if (!name || !phone || !address) {
            alert('कृपया अपना नाम, फोन नंबर और पता सही से भरें!');
            return;
        }

        const products = [
            { name: "टमाटर", price: 40, qtyId: "qty_0" },
            { name: "आलू", price: 30, qtyId: "qty_1" },
            { name: "प्याज़", price: 50, qtyId: "qty_2" },
            { name: "हरी मिर्च", price: 80, qtyId: "qty_3" }
        ];

        let orderedItems = [];
        let totalAmount = 0;

        products.forEach(p => {
            let qty = parseFloat(document.getElementById(p.qtyId).value) || 0;
            if (qty > 0) {
                let itemTotal = qty * p.price;
                orderedItems.push({ name: p.name, qty: qty, price: p.price });
                totalAmount += itemTotal;
            }
        });

        if (orderedItems.length === 0) {
            alert('कृपया कम से कम एक सब्ज़ी की मात्रा (Quantity) चुनें!');
            return;
        }

        const orderData = {
            customerName: name,
            customerPhone: phone,
            customerAddress: address,
            items: orderedItems,
            totalAmount: totalAmount,
            timestamp: Date.now()
        };

        push(ref(db, 'orders'), orderData)
            .then(() => {
                alert('🎉 आपका आर्डर सफलतापर्वक भेज दिया गया है!');
                // फॉर्म खाली करें
                document.getElementById('customerName').value = '';
                document.getElementById('customerPhone').value = '';
                document.getElementById('customerAddress').value = '';
                products.forEach(p => document.getElementById(p.qtyId).value = 0);
            })
            .catch((error) => {
                alert('आर्डर भेजने में कुछ दिक्कत आई: ' + error.message);
            });
    };
</script>

</body>
</html>
