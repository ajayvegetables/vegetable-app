<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>अजय कुमार वेजिटेबल्स - ऑनलाइन स्टोर</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f8; margin: 0; padding: 0; color: #333; }
        .header { background-color: #1b5e20; color: white; padding: 15px; text-align: center; font-size: 20px; font-weight: bold; }
        .container { max-width: 500px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .section-title { font-size: 16px; font-weight: bold; color: #1b5e20; margin-top: 20px; margin-bottom: 10px; border-bottom: 2px solid #c8e6c9; padding-bottom: 5px; }
        label { display: block; margin-top: 10px; font-size: 14px; font-weight: bold; }
        input[type="text"], select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn { background-color: #2e7d32; color: white; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        .btn:hover { background-color: #1b5e20; }
        .help-btn { background-color: #0288d1; margin-top: 15px; text-decoration: none; display: block; text-align: center; color: white; padding: 12px; border-radius: 4px; font-size: 16px; font-weight: bold; }
        .help-btn:hover { background-color: #01579b; }
        .hidden { display: none; }
        .vendor-card { background: #e8f5e9; border: 1px solid #a5d6a7; padding: 15px; margin-top: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .veg-item-box { background: #f9f9f9; padding: 12px; margin-top: 10px; border-radius: 4px; border: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .info-box { background: #fff3e0; border: 1px solid #ffe0b2; padding: 12px; margin-top: 15px; border-radius: 6px; font-size: 14px; color: #e65100; }
    </style>
</head>
<body>

    <div class="header">
        अजय कुमार वेजिटेबल्स - ऑनलाइन स्टोर
    </div>

    <div class="container">
        <!-- 1. दुकानदार चुनने का सेक्शन (Vendor Selection) -->
        <div id="selectVendorSection">
            <div class="section-title">🛒 अपने नजदीकी सब्जी विक्रेता चुनें</div>
            <p style="font-size: 14px; color: #555;">नीचे सूची में से चुनें कि आप किससे सब्ज़ी खरीदना चाहते हैं:</p>
            
            <div id="vendorListContainer">
                <!-- दुकानदारों की लिस्ट यहाँ लोड होगी -->
            </div>
        </div>

        <!-- 2. चुने गए दुकानदार का कैटलॉग और आर्डर फॉर्म -->
        <div id="customerOrderSection" class="hidden">
            <button onclick="goBackToVendors()" style="background: #757575; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin-bottom: 10px;">← दूसरे विक्रेता की सूची देखें</button>
            
            <div class="section-title" id="activeVendorTitle">दुकानदार का कैटलॉग</div>
            
            <div class="info-box" id="vendorContactBox">
                <!-- चुने हुए दुकानदार का मोबाइल नंबर और UPI दिखेगा -->
            </div>

            <div class="section-title">📋 उपलब्ध सब्जियां</div>
            <div id="customerVegList">
                <!-- दुकानदार की जोड़ी गई सब्जियां यहाँ दिखेंगी -->
            </div>

            <div class="section-title">👤 आपका विवरण (ग्राहक)</div>
            <label>आपका नाम:</label>
            <input type="text" id="custName" placeholder="अपना नाम दर्ज करें">

            <label>आपका मोबाइल नंबर:</label>
            <input type="text" id="custMobile" placeholder="10 अंकों का मोबाइल नंबर" maxlength="10">

            <label>डिलीवरी का पूरा पता:</label>
            <input type="text" id="custAddress" placeholder="घर का पता / कॉलोनी / मार्ग">

            <button class="btn" onclick="placeOrderToVendor()">🚀 आर्डर भेजें</button>
        </div>

        <!-- मास्टर हेल्प बटन (हर जगह दिखेगा) -->
        <a href="tel:9997077062" class="help-btn">📞 मास्टर हेल्प (तकनीकी सहायता: 9997077062)</a>
    </div>

    <script>
        let selectedVendorMobile = "";

        window.onload = function() {
            loadVendorsList();
        };

        function loadVendorsList() {
            let container = document.getElementById('vendorListContainer');
            container.innerHTML = "";

            let sampleVendors = [
                { name: "शिवम (सब्जी विक्रेता)", mobile: "919997077062", upi: "8218231811@nyes" },
                { name: "राहुल (सब्जी विक्रेता)", mobile: "9876543210", upi: "rahulveg@paytm" }
            ];

            sampleVendors.forEach(vendor => {
                let div = document.createElement('div');
                div.className = 'vendor-card';
                div.innerHTML = `
                    <div>
                        <b>${vendor.name}</b><br>
                        <span style="font-size: 13px; color: #555;">मोबाइल: ${vendor.mobile}</span>
                    </div>
                    <button class="btn" style="margin:0; width:auto; padding:8px 15px;" onclick="selectVendor('${vendor.mobile}', '${vendor.name}', '${vendor.upi}')">दुकान देखें</button>
                `;
                container.appendChild(div);
            });
        }

        function selectVendor(mobile, name, upi) {
            selectedVendorMobile = mobile;
            document.getElementById('selectVendorSection').classList.add('hidden');
            document.getElementById('customerOrderSection').classList.remove('hidden');
            
            document.getElementById('activeVendorTitle').innerText = `${name} का कैटलॉग`;
            document.getElementById('vendorContactBox').innerHTML = `
                <b>विक्रेता मोबाइल:</b> <a href="tel:${mobile}" style="color:#d32f2f; font-weight:bold;">${mobile}</a><br>
                <b>UPI ID (भुगतान हेतु):</b> <span style="color:#2e7d32; font-weight:bold;">${upi}</span>
            `;

            loadVendorVegetables(mobile);
        }

        function loadVendorVegetables(mobile) {
            let vegContainer = document.getElementById('customerVegList');
            vegContainer.innerHTML = `
                <div class="veg-item-box">
                    <span><b>आलू</b> - ₹30 / किग्रा <span style="color:green; font-size:12px;">(उपलब्ध)</span></span>
                    <input type="number" placeholder="किग्रा" style="width:70px; padding:5px;" id="qty_aloo" value="0">
                </div>
                <div class="veg-item-box">
                    <span><b>टमाटर</b> - ₹40 / किग्रा <span style="color:green; font-size:12px;">(उपलब्ध)</span></span>
                    <input type="number" placeholder="किग्रा" style="width:70px; padding:5px;" id="qty_tamatar" value="0">
                </div>
            `;
        }

        function goBackToVendors() {
            document.getElementById('customerOrderSection').classList.add('hidden');
            document.getElementById('selectVendorSection').classList.remove('hidden');
        }

        function placeOrderToVendor() {
            let name = document.getElementById('custName').value;
            let mobile = document.getElementById('custMobile').value;
            let address = document.getElementById('custAddress').value;

            if(name && mobile.length === 10 && address) {
                alert(`सफलतापूर्वक आर्डर दर्ज हो गया! विक्रेता (${selectedVendorMobile}) को आपका आर्डर भेज दिया गया है।`);
            } else {
                alert('कृपया अपना नाम, सही 10 अंकों का मोबाइल नंबर और पूरा पता दर्ज करें।');
            }
        }
    </script>
</body>
</html>
