<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>वेजिटेबल ऐप</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <!-- टॉप हेडर (हर जगह दिखेगा) -->
    <header class="bg-emerald-600 text-white p-4 shadow-md flex justify-between items-center sticky top-0 z-50">
        <h1 class="text-lg font-bold flex items-center gap-2">
            <i class="fa-solid fa-basket-shopping"></i> वेजिटेबल ऐप
        </h1>
        <div class="flex items-center gap-3">
            <!-- ऐप ओनर हेल्प बटन -->
            <a href="tel:YOUR_ADMIN_PHONE_NUMBER" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-full text-sm font-semibold flex items-center gap-1.5 shadow">
                <i class="fa-solid fa-phone"></i> Help
            </a>
            <!-- दुकानदार कॉल बटन (जब कैटलॉग खुलेगा तब दिखेगा) -->
            <a id="shopCallBtn" href="#" class="hidden bg-blue-500 hover:bg-blue-600 text-white px-3 py-1.5 rounded-full text-sm font-semibold flex items-center gap-1.5 shadow">
                <i class="fa-solid fa-phone"></i> <span id="shopkeeperNameHeader">दुकानदार</span>
            </a>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 pb-20">
        
        <!-- व्यू 1: दुकान चयन और एड्रेस फॉर्म (पहला पेज) -->
        <div id="shopSelectionView" class="space-y-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-md font-semibold text-gray-800 mb-3">अपनी नज़दीकी दुकान चुनें:</h2>
                <div id="shopListContainer" class="space-y-2">
                    <!-- दुकानदारों की लिस्ट यहाँ JavaScript से आएगी -->
                </div>
            </div>

            <!-- अलग-अलग एड्रेस बॉक्स -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 space-y-3">
                <h2 class="text-md font-semibold text-gray-800">डिलीवरी का पता और विवरण:</h2>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">आपका नाम</label>
                    <input type="text" id="custName" placeholder="अपना नाम लिखें" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">मोबाइल नंबर</label>
                    <input type="tel" id="custPhone" placeholder="10 अंकों का मोबाइल नंबर" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">पूरा पता (मकान नंबर, गली, मोहल्ला / एरिया)</label>
                    <textarea id="custAddress" rows="2" placeholder="मकान नंबर, गली, मोहल्ला / एरिया" class="w-full p-2.5 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                </div>
            </div>

            <button onclick="proceedToCatalog()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl shadow transition">
                आगे बढ़ें और कैटलॉग देखें
            </button>
        </div>

        <!-- व्यू 2: कैटलॉग पेज (दुकान चुनने के बाद खुलेगा) -->
        <div id="catalogView" class="hidden space-y-4">
            <div class="flex items-center justify-between bg-white p-3 rounded-xl shadow-sm border border-gray-200">
                <button onclick="goBackToShops()" class="text-emerald-600 text-sm font-semibold flex items-center gap-1">
                    <i class="fa-solid fa-arrow-left">3</i> दूसरी दुकान चुनें
                </button>
                <span id="selectedShopTitle" class="font-bold text-gray-800 text-sm"></span>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                <h2 class="text-md font-semibold text-gray-800 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-box text-amber-600"></i> उपलब्ध सब्जियां (ताज़ा स्टॉक)
                </h2>
                <div id="vegetableListContainer" class="space-y-3">
                    <!-- सब्जियों की लिस्ट -->
                </div>
            </div>

            <!-- आर्डर टोकरी (Cart) -->
            <div class="bg-emerald-50 p-4 rounded-xl border border-emerald-200 space-y-2">
                <h3 class="font-semibold text-emerald-900 text-sm">🛒 आपकी आर्डर टोकरी (Cart)</h3>
                <p id="cartSummary" class="text-xs text-gray-600">कोई सामान नहीं चुना गया है।</p>
                <div class="text-sm font-bold text-gray-800 pt-2 border-t border-emerald-200 flex justify-between">
                    <span>कुल देय राशि:</span>
                    <span id="totalPrice">₹0</span>
                </div>
            </div>

            <button onclick="sendOrder()" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-xl shadow transition flex items-center justify-center gap-2">
                <i class="fa-brands fa-whatsapp"></i> UPI पेमेंट करें और आर्डर भेजें
            </button>
        </div>

    </main>

    <script>
        // दुकानदारों और उनकी सब्जियों का डेटा (आप इसमें नए दुकानदार और सब्जियां आसानी से जोड़ सकते हैं)
        const shopsData = [
            {
                id: 1,
                name: "शिवम वेजिटेबल्स (सिविल लाइन्स)",
                phone: "9876543210",
                vegetables: [
                    { name: "आलू (नया)", price: 30 },
                    { name: "टमाटर (देशी)", price: 40 },
                    { name: "प्याज़", price: 35 },
                    { name: "हरी मिर्च", price: 60 }
                ]
            },
            {
                id: 2,
                name: "राहुल वेजिटेबल्स (मंडी रोड)",
                phone: "9123456789",
                vegetables: [
                    { name: "आलू (नया)", price: 28 },
                    { name: "टमाटर", price: 38 },
                    { name: "गोभी", price: 45 },
                    { name: "मटर", price: 50 }
                ]
            }
        ];

        let currentShop = null;
        let cart = {};

        // पेज लोड होने पर दुकानदारों की लिस्ट दिखाना
        function loadShops() {
            const container = document.getElementById('shopListContainer');
            container.innerHTML = '';
            shopsData.forEach(shop => {
                container.innerHTML += `
                    <label class="flex items-center gap-3 p-3 border border-gray-200 rounded-lg cursor-pointer hover:bg-emerald-50 transition">
                        <input type="radio" name="selectedShop" value="${shop.id}" class="w-4 h-4 text-emerald-600">
                        <span class="text-sm font-medium text-gray-700">${shop.name}</span>
                    </label>
                `;
            });
        }

        // कैटलॉग पर आगे बढ़ना
        function proceedToCatalog() {
            const selectedRadio = document.querySelector('input[name="selectedShop"]:checked');
            const name = document.getElementById('custName').value.trim();
            const phone = document.getElementById('custPhone').value.trim();
            const address = document.getElementById('custAddress').value.trim();

            if (!selectedRadio) {
                alert("कृपया पहले सूची में से कोई एक दुकान चुनें!");
                return;
            }
            if (!name || !phone || !address) {
                alert("कृपया अपना नाम, मोबाइल नंबर और पूरा पता सही से भरें!");
                return;
            }

            const shopId = selectedRadio.value;
            currentShop = shopsData.find(s => s.id == shopId);

            // टॉप हेडर में दुकानदार का कॉल बटन सेट करना
            document.getElementById('shopkeeperNameHeader').innerText = "Shopkeeper";
            document.getElementById('shopCallBtn').href = `tel:${currentShop.phone}`;
            document.getElementById('shopCallBtn').classList.remove('hidden');

            // शीर्षक सेट करना
            document.getElementById('selectedShopTitle').innerText = currentShop.name;

            // सब्जियां रेंडर करना
            renderVegetables();

            // व्यू बदलना
            document.getElementById('shopSelectionView').classList.add('hidden');
            document.getElementById('catalogView').classList.remove('hidden');
        }

        // सब्जियां दिखाना
        function renderVegetables() {
            const container = document.getElementById('vegetableListContainer');
            container.innerHTML = '';
            cart = {};

            currentShop.vegetables.forEach((veg, index) => {
                cart[index] = { name: veg.name, price: veg.price, qty: 0 };
                container.innerHTML += `
                    <div class="flex items-center justify-between p-2.5 bg-gray-50 rounded-lg border border-gray-200">
                        <span class="text-sm font-medium text-gray-800">${veg.name} - ₹${veg.price}/किग्रा</span>
                        <div class="flex items-center gap-2">
                            <button onclick="updateQty(${index}, -1)" class="w-7 h-7 bg-red-500 text-white rounded font-bold flex items-center justify-center">-</button>
                            <span id="qty-${index}" class="w-6 text-center text-sm font-bold">0</span>
                            <button onclick="updateQty(${index}, 1)" class="w-7 h-7 bg-emerald-600 text-white rounded font-bold flex items-center justify-center">+</button>
                        </div>
                    </div>
                `;
            });
            updateCartSummary();
        }

        // मात्रा (Quantity) घटाना-बढ़ाना
        function updateQty(index, change) {
            if (cart[index].qty + change >= 0) {
                cart[index].qty += change;
                document.getElementById(`qty-${index}`).innerText = cart[index].qty;
                updateCartSummary();
            }
        }

        // कार्ट समरी अपडेट करना
        function updateCartSummary() {
            let summaryText = "";
            let total = 0;
            let hasItems = false;

            for (let index in cart) {
                if (cart[index].qty > 0) {
                    hasItems = true;
                    let cost = cart[index].qty * cart[index].price;
                    total += cost;
                    summaryText += `${cart[index].name} (${cart[index].qty} किग्रा) - ₹${cost}<br>`;
                }
            }

            if (!hasItems) {
                document.getElementById('cartSummary').innerText = "कोई सामान नहीं चुना गया है।";
            } else {
                document.getElementById('cartSummary').innerHTML = summaryText;
            }
            document.getElementById('totalPrice').innerText = `₹${total}`;
        }

        // वापस दुकान चयन पर जाना
        function goBackToShops() {
            document.getElementById('shopCallBtn').classList.add('hidden');
            document.getElementById('catalogView').classList.add('hidden');
            document.getElementById('shopSelectionView').classList.remove('hidden');
        }

        function sendOrder() {
            alert("आर्डर की प्रक्रिया पूरी हुई! इसे व्हाट्सएप या यूपीआई से जोड़ा जा सकता है।");
        }

        // लोड होने पर फंक्शन कॉल करें
        window.onload = loadShops;
    </script>
</body>
</html>
