<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ऑनलाइन स्टोर - आर्डर करें</title>
    <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22%E0%A4%85%E0%A4%82%E0%A4%B2%E0%A4%BE%E0%A4%87%E0%A4%A8%20%E0%A4%B8%E0%A5%8D%E0%A4%9A%E0%A5%8B%E0%A4%B0%22%2C%22short_name%22%3A%22Store%22%2C%22start_url%22%3A%22.%2Fcustomer.html%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23e8f5e9%22%2C%22theme_color%22%3A%22%232e7d32%22%7D">
    <meta name="theme-color" content="#2e7d32">
    
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #e8f5e9; margin: 0; padding: 5px; color: #333; padding-bottom: 70px; }
        .container { width: 100%; max-width: 480px; margin: auto; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
        
        .header { display: flex; justify-content: space-between; align-items: center; background: #2e7d32; color: white; padding: 8px 12px; border-radius: 6px; margin-bottom: 8px; }
        .shop-title { font-size: 15px; font-weight: bold; }
        .help-btn { background: #c62828; color: white; padding: 4px 8px; border-radius: 4px; text-decoration: none; font-size: 11px; font-weight: bold; }
        .shop-btn { background: #1976d2; color: white; padding: 4px 8px; border-radius: 4px; text-decoration: none; font-size: 11px; font-weight: bold; }

        .banner { background: #fffde7; border: 1px dashed #fbc02d; padding: 6px; border-radius: 5px; font-size: 11px; color: #f57f17; font-weight: bold; margin-bottom: 8px; text-align: center; }
        .catalog-title { font-size: 13px; color: #2e7d32; border-bottom: 2px solid #c8e6c9; padding-bottom: 3px; margin-bottom: 8px; font-weight: bold; }
        
        .product-card { display: flex; align-items: center; background: #fafafa; border: 1px solid #e0e0e0; padding: 8px; border-radius: 6px; margin-bottom: 6px; gap: 8px; }
        .product-emoji { font-size: 28px; width: 40px; text-align: center; flex-shrink: 0; }
        .product-info { flex-grow: 1; font-size: 12px; }
        .product-name { font-weight: bold; color: #333; font-size: 13px; }
        .product-eng-name { font-size: 10px; color: #1976d2; font-weight: bold; margin-top: 1px; }
        .product-price { color: #d32f2f; font-weight: bold; font-size: 11px; margin-top: 2px; }
        
        .qty-select { padding: 4px; border: 1px solid #ccc; border-radius: 4px; font-size: 11px; background: white; }
        .add-btn { background: #2e7d32; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 11px; font-weight: bold; cursor: pointer; }

        .cart-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #2e7d32; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -2px 6px rgba(0,0,0,0.2); z-index: 1000; font-size: 13px; font-weight: bold; }
        .checkout-btn { background: #ff9800; color: white; border: none; padding: 6px 14px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; padding: 10px; }
        .modal-content { background: white; padding: 15px; width: 95%; max-width: 400px; border-radius: 8px; max-height: 85vh; overflow-y: auto; position: relative; }
        .close-modal { position: absolute; top: 8px; right: 8px; font-size: 14px; font-weight: bold; cursor: pointer; color: #fff; background: #c62828; padding: 2px 7px; border-radius: 50%; }

        .form-group { margin-bottom: 8px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 2px; font-size: 11px; }
        .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; }
        .btn-main { background: #2e7d32; color: white; border: none; width: 100%; padding: 10px; border-radius: 4px; font-size: 13px; font-weight: bold; cursor: pointer; text-align: center; }
        .cart-item-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #eee; padding: 5px 0; font-size: 11px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div>
            <a href="shopkeeper.html" class="shop-btn">🛒 दुकानदार</a>
        </div>
        <div class="shop-title">ऑनलाइन स्टोर</div>
        <div>
            <a href="tel:9997077062" class="help-btn">📞 Help</a>
        </div>
    </div>

    <div class="banner" id="shopBanner">विशेष ऑफर: ₹200 से अधिक के आर्डर पर विशेष छूट!</div>

    <div class="catalog-title">📦 उपलब्ध आइटम कैटलॉग (लाइव अपडेटेड)</div>
    <div id="customer-catalog-container">
        <p style="text-align: center; color: #777; font-size: 12px;">कैटलॉग लोड हो रहा है...</p>
    </div>
</div>

<div class="cart-bar" id="cartBar" style="display:none;">
    <div>🛒 कार्ट: <span id="cartCount">0</span> | कुल: ₹<span id="cartTotal">0</span></div>
    <button class="checkout-btn" onclick="openCheckoutModal()">आर्डर फाइनल करें ➡️</button>
</div>

<!-- Checkout Modal -->
<div id="checkoutModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" onclick="closeCheckoutModal()">&times;</span>
        <h3 style="color:#2e7d32; margin-top:0; font-size:14px;">🛍️ आपका कार्ट और आर्डर विवरण</h3>
        <div id="cartItemsList" style="margin-bottom: 10px; max-height: 150px; overflow-y: auto;"></div>
        
        <div class="form-group"><label>आपका नाम:</label><input type="text" id="custName" placeholder="पूरा नाम दर्ज करें"></div>
        <div class="form-group"><label>मोबाइल नंबर:</label><input type="tel" id="custPhone" placeholder="10 अंकों का मोबाइल नंबर" maxlength="10"></div>
        <div class="form-group"><label>पूरा पता (Address):</label><input type="text" id="custAddress" placeholder="मोहल्ला, मकान नंबर, गली..."></div>
        
        <button class="btn-main" onclick="placeOrderToDatabase()">🚀 आर्डर भेजें (Live)</button>
    </div>
</div>

<!-- Success Modal -->
<div id="successModal" class="modal">
    <div class="modal-content" style="text-align: center;">
        <h3 style="color: #2e7d32; margin-top:0;">🎉 आर्डर सफलतापूर्वक भेज दिया गया है!</h3>
        <p id="successMsgText" style="font-size: 12px; line-height: 1.5; color: #333;"></p>
        <button class="btn-main" onclick="location.reload()" style="margin-top: 10px;">ठीक है (OK)</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD4LjdqlsKNH7ZU9p8NMgtnqDuybiSI0fs",
        authDomain: "ajayvegetables-e6201.firebaseapp.com",
        databaseURL: "https://ajayvegetables-e6201-default-rtdb.firebaseio.com",
        projectId: "ajayvegetables-e6201",
        storageBucket: "ajayvegetables-e6201.firebasestorage.app",
        messagingSenderId: "735482766488",
        appId: "1:735482766488:web:a7121405cb15fffefd1ced",
        measurementId: "G-KBGKZ36RY8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let currentCatalog = [];
    let cart = {};

    // 100% सटीक और पक्के इमोजी आइकन (सब्जियां, फल, फास्ट फूड)
    function getItemEmoji(itemName) {
        if (!itemName) return "🛍️";
        let name = itemName.trim().toLowerCase();

        if (name.includes("गोभी")) return "🥦";
        if (name.includes("लौकी")) return "🥒";
        if (name.includes("मूली")) return "🥕";
        if (name.includes("गाजर")) return "🥕";
        if (name.includes("शिमला")) return "🫑";
        if (name.includes("मिर्च") || name.includes("chilli")) return "🌶️";
        if (name.includes("मेथी") || name.includes("पालक") || name.includes("धनिया")) return "🌿";
        if (name.includes("कद्दू") || name.includes("pumpkin")) return "🎃";
        if (name.includes("टमाटर") || name.includes("tomato")) return "🍅";
        if (name.includes("आलू") || name.includes("potato")) return "🥔";
        if (name.includes("प्याज") || name.includes("प्याज़") || name.includes("onion")) return "🧅";
        if (name.includes("मटर") || name.includes("peas")) return "🟢";
        if (name.includes("अदरक") || name.includes("ginger") || name.includes("लहसुन")) return "🧄";
        if (name.includes("समोसा") || name.includes("samosa")) return "🥟";
        if (name.includes("कचौड़ी") || name.includes("kachori")) return "🥠";
        if (name.includes("बर्गर") || name.includes("burger")) return "🍔";
        if (name.includes("पिज़्ज़ा") || name.includes("पिज्जा") || name.includes("pizza")) return "🍕";
        if (name.includes("जलेबी") || name.includes("jalebi")) return "🥨";
        if (name.includes("सेब") || name.includes("apple")) return "🍎";
        if (name.includes("केला") || name.includes("banana")) return "🍌";
        if (name.includes("आम") || name.includes("mango")) return "🥭";
        if (name.includes("नींबू") || name.includes("lemon")) return "🍋";
        
        return "🛒";
    }

    // अंग्रेजी अनुवाद डिक्शनरी
    const universalDictionary = {
        "मेथी": "Fenugreek", "कद्दू": "Pumpkin", "पालक": "Spinach", "टमाटर": "Tomato",
        "आलू": "Potato", "प्याज़": "Onion", "प्याज": "Onion", "मटर": "Green Peas",
        "गाजर": "Carrot", "मूली": "Radish", "अदरक": "Ginger", "लहसुन": "Garlic",
        "गोभी": "Cauliflower", "पत्तागोभी": "Cabbage", "बैंगन": "Brinjal", "भिंडी": "Ladyfinger",
        "शिमला मिर्च": "Capsicum", "नींबू": "Lemon", "धनिया": "Coriander", "हरी मिर्च": "Green Chilli",
        "खीरा": "Cucumber", "लौकी": "Bottle Gourd", "तोरी": "Ridge Gourd", "करेला": "Bitter Gourd",
        "चुकंदर": "Beetroot", "सेब": "Apple", "केला": "Banana", "आम": "Mango",
        "समोसा": "Samosa", "कचौड़ी": "Kachori", "बर्गर": "Burger", "पिज़्ज़ा": "Pizza", "जलेबी": "Jalebi"
    };

    function getEnglishName(hindiName) {
        if (!hindiName) return "Item";
        let clean = hindiName.trim();
        return universalDictionary[clean] || clean;
    }

    window.onload = function() {
        const settingsRef = ref(db, 'shopSettings');
        onValue(settingsRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if(data.offerText) document.getElementById('shopBanner').innerText = data.offerText;
                if(data.catalog) {
                    currentCatalog = data.catalog;
                    renderCustomerCatalog(currentCatalog);
                }
            }
        });

        let savedPhone = localStorage.getItem("custPhone");
        if (savedPhone) document.getElementById('custPhone').value = savedPhone;
        let savedName = localStorage.getItem("custName");
        if (savedName) document.getElementById('custName').value = savedName;
    };

    function renderCustomerCatalog(catalog) {
        let container = document.getElementById('customer-catalog-container');
        container.innerHTML = "";

        let availableItems = catalog.filter(item => !item.outOfStock && (item.stock === undefined || item.stock > 0));

        if (availableItems.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: #d32f2f; font-weight: bold; font-size: 12px;">फिलहाल कोई भी आइटम स्टॉक में उपलब्ध नहीं है।</p>';
            return;
        }

        availableItems.forEach((item, index) => {
            let emojiIcon = getItemEmoji(item.name);
            let engName = getEnglishName(item.name);
            let card = document.createElement('div');
            card.className = "product-card";
            card.innerHTML = `
                <div class="product-emoji">${emojiIcon}</div>
                <div class="product-info">
                    <div class="product-name">${item.name}</div>
                    <div class="product-eng-name">(${engName})</div>
                    <div class="product-price">₹${item.price} / किलो</div>
                </div>
                <div>
                    <select class="qty-select" id="qty_${index}">
                        <option value="0.05">50 ग्राम</option>
                        <option value="0.1">100 ग्राम</option>
                        <option value="0.2">200 ग्राम</option>
                        <option value="0.25">250 ग्राम</option>
                        <option value="0.5" selected>500 ग्राम</option>
                        <option value="0.75">750 ग्राम</option>
                        <option value="1">1 किलो</option>
                        <option value="2">2 किलो</option>
                        <option value="3">3 किलो</option>
                        <option value="5">5 किलो</option>
                        <option value="10">10 किलो</option>
                    </select>
                </div>
                <button class="add-btn" onclick="addToCart('${item.name}', ${item.price}, ${index})">जोड़ें</button>
            `;
            container.appendChild(card);
        });
    }

    window.addToCart = function(name, price, index) {
        let qtySelect = document.getElementById(`qty_${index}`);
        let qtyVal = parseFloat(qtySelect.value) || 0.5;
        let qtyText = qtySelect.options[qtySelect.selectedIndex].text;

        if (!cart[name]) {
            cart[name] = { name: name, price: price, qty: 0, qtyText: qtyText };
        }
        cart[name].qty += qtyVal;
        
        if(qtyVal < 1) {
            cart[name].qtyText = `${Math.round(cart[name].qty * 1000)} ग्राम`;
        } else {
            cart[name].qtyText = `${cart[name].qty} किलो`;
        }

        updateCartBar();
        alert(`'${name}' (${qtyText}) कार्ट में जोड़ दिया गया है!`);
    };

    function updateCartBar() {
        let totalCount = 0;
        let totalPrice = 0;

        Object.keys(cart).forEach(key => {
            let item = cart[key];
            totalCount += 1;
            totalPrice += (item.price * item.qty);
        });

        document.getElementById('cartCount').innerText = totalCount;
        document.getElementById('cartTotal').innerText = Math.round(totalPrice);

        if (totalCount > 0) {
            document.getElementById('cartBar').style.display = 'flex';
        } else {
            document.getElementById('cartBar').style.display = 'none';
        }
    }

    window.openCheckoutModal = function() {
        let listContainer = document.getElementById('cartItemsList');
        listContainer.innerHTML = "";

        Object.keys(cart).forEach(key => {
            let item = cart[key];
            let row = document.createElement('div');
            row.className = "cart-item-row";
            row.innerHTML = `<span><b>${item.name}</b> (${item.qtyText})</span> <span>₹${Math.round(item.price * item.qty)}</span>`;
            listContainer.appendChild(row);
        });

        document.getElementById('checkoutModal').style.display = 'flex';
    };

    window.closeCheckoutModal = function() {
        document.getElementById('checkoutModal').style.display = 'none';
    };

    window.placeOrderToDatabase = function() {
        let name = document.getElementById('custName').value.trim();
        let phone = document.getElementById('custPhone').value.trim();
        let address = document.getElementById('custAddress').value.trim();

        if (!name || phone.length !== 10 || !address) {
            alert("कृपया अपना सही नाम, 10 अंकों का फोन नंबर और पूरा पता दर्ज करें!");
            return;
        }

        localStorage.setItem("custName", name);
        localStorage.setItem("custPhone", phone);

        let itemsArray = [];
        let totalAmount = 0;

        Object.keys(cart).forEach(key => {
            let item = cart[key];
            itemsArray.push({
                name: item.name,
                qty: item.qty,
                qtyText: item.qtyText,
                price: item.price
            });
            totalAmount += (item.price * item.qty);
        });

        let orderData = {
            customerName: name,
            customerPhone: phone,
            customerAddress: address,
            items: itemsArray,
            totalAmount: Math.round(totalAmount),
            distance: "लगभग 1.5 किमी",
            mapLocationUrl: "https://maps.google.com",
            timestamp: Date.now()
        };

        const newOrderRef = push(ref(db, 'orders'));
        set(newOrderRef, orderData).then(() => {
            closeCheckoutModal();
            document.getElementById('successMsgText').innerHTML = `आर्डर सफलतापूर्वक दुकानदार के पास भेज दिया गया है!<br><b>कुल राशि: ₹${Math.round(totalAmount)}</b><br>दुकानदार जल्द ही आपसे संपर्क करेगा।`;
            document.getElementById('successModal').style.display = 'flex';
            cart = {};
            updateCartBar();
        }).catch((err) => {
            alert("आर्डर भेजने में त्रुटि: " + err.message);
        });
    };
</script>

</body>
</html>
